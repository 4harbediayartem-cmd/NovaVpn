
name: Build NovaVPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          test -n "$ZIP"
          unzip -o "$ZIP" -d extracted

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)
          cd "$PROJECT"
          flutter pub get
          flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaVPN-APK
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
